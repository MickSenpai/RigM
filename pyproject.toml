[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rigm"
version = "0.1.0"
description = "Editor de rigs 2D desde ilustraciones"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.7", "Pillow>=10.0"]

[project.optional-dependencies]
inpaint = ["opencv-python-headless>=4.9"]
segmentation = ["torch>=2.1", "torchvision>=0.16", "transformers>=4.57"]
rigging = ["opencv-python-headless>=4.9"]
decomposition = ["gradio_client>=1.6", "psd-tools>=1.9"]

[project.scripts]
rigm = "rigm.app:main"
rigmctl = "rigm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
